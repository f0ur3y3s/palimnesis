name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Linux is where the suite is run day to day (pythia); Windows is where Pi and
        # OpenCode run against the proxy; macOS is where people run local models on Apple
        # silicon, and where a Strata release is vetted in mock mode (mbp, R50).
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Test
        # The deterministic suite: a fake upstream on real loopback sockets, no network.
        run: uv run pytest -q

  build:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Install the wheel in a clean environment and run the CLI
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/palimnesis --help
          /tmp/smoke/bin/palimnesis setup pi --model smoke --agent-dir /tmp/smoke-pi --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
