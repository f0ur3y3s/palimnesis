[project]
name = "mnemon"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-re2>=1.1.20251105",
    "httpx>=0.28.1",
    "jinja2==3.1.6",
    "tokenizers==0.23.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project.scripts]
mnemon = "mnemon.cli:main"
